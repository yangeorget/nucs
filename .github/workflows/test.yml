name: tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  test-nucs:
    name: Test NUCS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install .[dev]
          pip install .[test]
      - name: Install MiniZinc
        env:
          MZN_VERSION: "2.9.7"
        run: |
          curl -fsSL -o /tmp/minizinc.tgz \
              "https://github.com/MiniZinc/MiniZincIDE/releases/download/${MZN_VERSION}/MiniZincIDE-${MZN_VERSION}-bundle-linux-x86_64.tgz"
          mkdir -p "$HOME/minizinc"
          tar -xzf /tmp/minizinc.tgz -C "$HOME/minizinc" --strip-components=1
          echo "$HOME/minizinc/bin" >> "$GITHUB_PATH"
      - name: Verify MiniZinc
        run: minizinc --version
      # Check only, never fix: a fix made on the runner is thrown away, and the step would pass on code that is not clean.
      - name: Ruff check
        run: ruff check nucs tests scripts
      - name: Ruff format
        run: ruff format --diff nucs tests scripts
      - name: Check typing with mypy
        run: mypy nucs tests scripts
      - name: Test with pytest (with Numba)
        run: NUMBA_CACHE_DIR=.numba/cache pytest
      # Coverage is measured on this run, not the jitted one: under the JIT a propagator's body is compiled and
      # never executes as Python, so coverage would report the hottest code in the library as unexecuted.
      # PYTHONPATH=. puts the working tree ahead of the installed copy, so the paths reported are repo-relative.
      - name: Test with pytest (without Numba), under coverage
        run: NUMBA_DISABLE_JIT=1 PYTHONPATH=. coverage run --source=nucs -m pytest
      - name: Report coverage
        run: coverage report
      # One upload per commit: the three matrix versions cover the same lines, and Coveralls would otherwise
      # report the last to finish. 3.13 is the version readthedocs builds with.
      - name: Generate the LCOV report
        if: matrix.python-version == '3.13'
        run: coverage lcov -o coverage.lcov
      - name: Send to Coveralls
        if: matrix.python-version == '3.13'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov

  build-docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"  # the version readthedocs builds with, per .readthedocs.yaml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install .
      # -W turns warnings into errors: a malformed table or a broken reference degrades silently
      # otherwise, still building a page but not the one that was written. --keep-going reports all
      # of them rather than stopping at the first.
      - name: Build the documentation, with warnings as errors
        run: sphinx-build -M html docs/source docs/output -W --keep-going
